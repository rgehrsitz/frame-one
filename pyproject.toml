[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-one"
version = "0.1.0"
description = "Deterministic renderer for the Frame One e-paper dashboard"
requires-python = ">=3.11"
dependencies = ["Pillow>=11.0"]

[project.scripts]
frame-one = "frame_one.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
