[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-one"
version = "0.1.0"
description = "Deterministic renderer for the Frame One e-paper dashboard"
requires-python = ">=3.11"
dependencies = ["Pillow>=11.0"]

[project.scripts]
frame-one = "frame_one.cli:main"
frame-one-claude-statusline = "frame_one.claude_statusline:main"
frame-one-claude-login = "frame_one.claude_login:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
frame_one = ["assets/fonts/*"]
